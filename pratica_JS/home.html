<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title> pRATICANDO JS </title>
</head>

<body>

    <main>
        <h1> Praticando Java Script</h1>

        <section>
            <h2>Trocar um nome na tela</h2>
            <input type="text" id="entrada_Nome" placeholder="Informe o seu nome">
            <button id="btn_Troca"> Trocar nome </button>
            <p> Olá <b id="nome_Saida">Visitante </b></p>
        </section>
        <section>
            <h2> Alterando a cor da caixa </h2>
            <div id="caixa" class="btn">Aqui a caixa</div>
            <button id="btn_Verde" class="btn">Verde</button>
            <button id="btn_amarelo" class="btn">Amarelo</button>
            <button id="btn_Azul" class="btn">Azul</button>
        </section>

        <h2> Simulando adiçao e subtracao de valores </h2>
        <section class="area_add_sub">

            <button id="btn_menos"> - </button> 
            <p id="valor_real"> 0 </p>
            <button id="btn_mais"> + </button>
    
        </section>

        <h2> Adicionando Livros </h2>
        <section class="area-livro">

            <input type="text" id="nome_livro" placeholder="nome do livro">
            <button id="adiciona_livro" > Adicionar </button>

            <ul id="lista_livros">

            </ul>

        </section>

    </main>



    <script src="home.js"></script>


</body>

</html>
