<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro_Login.css">
    <title> Cadastro de Login </title>
</head>

<body>
    <main>
        <div class="Cadastro">
            <div class="title_Cadastro">
                <h1>Net<span>book</span>Work</h1>
                <h3> Troque Livros, Multiplique Histórias </h3>
            </div>
            <form action="#" method="post" id="form_Cadastro">
                <div class="sessao_Cadastro">
                    <label for="cadastro_Nome"> Nome </label>
                    <input type="text" id="cadastro_Nome" placeholder=" Informe o seu nome ">

                    <label for="cadastro_Email"> Email </label>
                    <input type="text" id="cadastro_Email" placeholder=" Informe o seu email ">

                    <label for="cadastro_Usuario"> Usuário </label>
                    <input type="text" id="cadastro_Usuario" placeholder=" Informe o seu usuário ">

                    <label for="#"> Senha </label>
                    <input type="" id="cadastro_Senha" placeholder=" Informe sua senha ">

                    <label for=""> Confirmar Senha </label>
                    <input type="text" id="confirmar_Senha" placeholder=" Confirme a senha ">
                </div>
            <div class="parte_Btn">
                <button id="btn_Cadastre"> Cadastrar-se </button>
                <a href="login.html" id="ja_Possui_Conta"> Já possuo uma conta. Acessar agora! </a>
            </div>    
            </form>
        </div>
    </main>

</body>

</html>
